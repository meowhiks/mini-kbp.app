services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    # Public DNS from Docker is often filtered/refused on this network; prefer host router DNS.
    # Proxy also has UDP DNS fallback + IPv4/SNI (see accounts/kbp_proxy_views.py).
    dns:
      - ${DOCKER_DNS:-10.122.125.226}
    env_file:
      - .env
    volumes:
      - ./server:/app
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-1}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-django-insecure-local-dev-only-change-me}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:-}"
      APP_DEPLOY_HOST: "${APP_DEPLOY_HOST:-26.85.162.251}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-http://26.85.162.251}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-}"
      DJANGO_CORS_ORIGINS: "${DJANGO_CORS_ORIGINS:-}"
      TRUST_PROXY_SSL: "${TRUST_PROXY_SSL:-1}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_BOT_USERNAME: "${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}"
      TELEGRAM_OIDC_CLIENT_SECRET: "${TELEGRAM_OIDC_CLIENT_SECRET:-}"
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-}"
      APP_AUTH_ALLOW_DEV_TELEGRAM: "${APP_AUTH_ALLOW_DEV_TELEGRAM:-}"
      EMAIL_HOST: "${EMAIL_HOST:-postfix}"
      EMAIL_PORT: "${EMAIL_PORT:-25}"
      EMAIL_USE_TLS: "${EMAIL_USE_TLS:-0}"
      EMAIL_USE_SSL: "${EMAIL_USE_SSL:-0}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-MiniKBP <onboarding@resend.dev>}"
      APP_EMAIL_ENABLED: "${APP_EMAIL_ENABLED:-1}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      APP_COOKIE_DOMAIN: "${APP_COOKIE_DOMAIN:-.mini-kbp.site}"
      DOCKER_DNS: "${DOCKER_DNS:-10.122.125.226}"
      KBP_DNS_SERVERS: "${KBP_DNS_SERVERS:-10.122.125.226}"
    command: 'sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"'
    ports:
      - "8000:8000"
    depends_on:
      - postfix
      - redis
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile.prod
      args:
        NEXT_PUBLIC_MINIKBP_SERVER_URL: "${NEXT_PUBLIC_MINIKBP_SERVER_URL:-https://lk.mini-kbp.site}"
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: "${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}"
        NEXT_PUBLIC_TELEGRAM_BOT_CLIENT_ID: "${NEXT_PUBLIC_TELEGRAM_BOT_CLIENT_ID:-}"
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: "${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}"
        APP_PUBLIC_URL: "${APP_PUBLIC_URL:-https://lk.mini-kbp.site}"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_DEPLOY_HOST: "${APP_DEPLOY_HOST:-26.85.162.251}"
      NEXT_PUBLIC_MINIKBP_SERVER_URL: "${NEXT_PUBLIC_MINIKBP_SERVER_URL:-https://lk.mini-kbp.site}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-https://lk.mini-kbp.site}"
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: "${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}"
      NEXT_PUBLIC_TELEGRAM_BOT_CLIENT_ID: "${NEXT_PUBLIC_TELEGRAM_BOT_CLIENT_ID:-}"
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: "${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}"
      NEXT_PUBLIC_PUSH_BACKEND_URL: "${NEXT_PUBLIC_PUSH_BACKEND_URL:-}"
      APP_AUTH_ALLOW_DEV_TELEGRAM: "${APP_AUTH_ALLOW_DEV_TELEGRAM:-}"
    volumes:
      # Desktop/APK artifacts stay on host; avoid baking hundreds of MB into the image
      - ./public/downloads:/app/public/downloads:ro
    expose:
      - "3000"
    depends_on:
      - api
    restart: unless-stopped

  postfix:
    image: boky/postfix:latest
    environment:
      ALLOWED_SENDER_DOMAINS: "${POSTFIX_ALLOWED_SENDER_DOMAINS:-mini-kbp.site,lk.mini-kbp.site}"
      HOSTNAME: "${POSTFIX_HOSTNAME:-mail.mini-kbp.site}"
      RELAYHOST: "${EMAIL_RELAYHOST:-}"
      RELAYHOST_USERNAME: "${EMAIL_RELAYHOST_USER:-}"
      RELAYHOST_PASSWORD: "${EMAIL_RELAYHOST_PASSWORD:-}"
      # Без relay исходящий :25 часто блокируется; IPv6 в Docker на Windows недоступен
      POSTFIX_inet_protocols: ipv4
      # Django (api) в docker-сети — разрешить отправку на любые адреса
      POSTFIX_smtpd_recipient_restrictions: "permit_mynetworks,reject_non_fqdn_recipient,reject_unknown_recipient_domain,check_sender_access lmdb:/etc/postfix/allowed_senders,reject_unauth_destination"
    restart: unless-stopped

  nginx:
    profiles: ["legacy-nginx"]
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

  apache:
    build:
      context: ./docker/apache
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/apache/certs:/usr/local/apache2/certs:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

  # Публичный доступ через Cloudflare Tunnel (DNS proxy)
  # docker compose --profile tunnel up -d
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2024.12.2
    restart: unless-stopped
    depends_on:
      - apache
    command:
      - tunnel
      - --protocol
      - http2
      - --config
      - /etc/cloudflared/config.yml
      - run
    volumes:
      - ./docker/cloudflare:/etc/cloudflared:ro
