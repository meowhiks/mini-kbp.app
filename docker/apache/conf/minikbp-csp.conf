# Единая CSP для lk / panel (Google Sign-In, Telegram OAuth, шрифты)

<IfModule headers_module>
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://telegram.org https://oauth.telegram.org https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https: wss: https://accounts.google.com https://oauth2.googleapis.com https://static.cloudflareinsights.com; frame-src 'self' https://accounts.google.com https://oauth.telegram.org https://telegram.org; frame-ancestors 'self';"
</IfModule>
