# panel.mini-kbp.site → staff UI без префикса /staff. /_next никогда не редиректить.

<VirtualHost *:80>
    ServerName panel.mini-kbp.site

    Include conf/extra/minikbp-common.conf
    Include conf/extra/minikbp-csp.conf

    ProxyPass /v0/ http://api:8000/v0/ responsefieldsize=65536
    ProxyPassReverse /v0/ http://api:8000/v0/

    <Location /v0/journal-presence/stream/>
        ProxyPass http://api:8000/v0/journal-presence/stream/
        SetEnv proxy-nokeepalive 1
        SetEnv proxy-sendchunked 1
        SetEnv no-gzip 1
    </Location>

    RewriteEngine On

    <LocationMatch "^/_next/">
        Header always set Cache-Control "no-store"
        Header always set CDN-Cache-Control "no-store"
        Header always set Cloudflare-CDN-Cache-Control "no-store"
    </LocationMatch>

    ProxyPass /admin/ !
    RedirectMatch 404 ^/admin(/.*)?$

    <Location />
        ProxyErrorOverride On
    </Location>
    <Location /v0/>
        ProxyErrorOverride Off
    </Location>

    RewriteCond %{REQUEST_URI} !^/v0/
    RewriteCond %{REQUEST_URI} !^/errors(/.*)?$
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://web:3000/$1 [P,L]

    RewriteCond %{REQUEST_URI} !^/v0/
    RewriteCond %{REQUEST_URI} !^/errors(/.*)?$
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*) http://web:3000/$1 [P,L]

    ProxyPassReverse / http://web:3000/

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
