# Shared TLS settings for local HTTPS (Cloudflare tunnel keeps using :80).

SSLEngine on
SSLCertificateFile /usr/local/apache2/certs/mini-kbp.site.fullchain.crt
SSLCertificateKeyFile /usr/local/apache2/certs/mini-kbp.site.key
SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
SSLCipherSuite HIGH:!aNULL:!MD5:!RC4:!3DES
SSLHonorCipherOrder on
