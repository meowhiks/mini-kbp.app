# mini-kbp.site / www — лендинг Next.js; кабинет живёт на lk.

<VirtualHost *:80>
    ServerName mini-kbp.site
    ServerAlias www.mini-kbp.site

    Include conf/extra/minikbp-common.conf
    Include conf/extra/minikbp-csp.conf

    ProxyPass /v0/ http://api:8000/v0/ responsefieldsize=65536
    ProxyPassReverse /v0/ http://api:8000/v0/

    RewriteEngine On

    RewriteRule ^/staff$ https://panel.mini-kbp.site/ [R=301,L,NE]
    RewriteRule ^/staff/(.*)$ https://panel.mini-kbp.site/$1 [R=301,L,NE]

    ProxyPass /admin/ !
    RedirectMatch 404 ^/admin(/.*)?$

    <Location />
        ProxyErrorOverride On
    </Location>
    <Location /v0/>
        ProxyErrorOverride Off
    </Location>

    RewriteCond %{REQUEST_URI} !^/v0/
    RewriteCond %{REQUEST_URI} !^/errors(/.*)?$
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://web:3000/$1 [P,L]

    RewriteCond %{REQUEST_URI} !^/v0/
    RewriteCond %{REQUEST_URI} !^/errors(/.*)?$
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*) http://web:3000/$1 [P,L]

    ProxyPassReverse / http://web:3000/

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
