# Docker embeds DNS at 127.0.0.11; resolve upstream names per request so
# recreated containers (new IP) do not leave nginx proxying a dead address.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# --- API: api.mini-kbp.site → Django ---
server {
    listen 80;
    server_name api.mini-kbp.site;

    client_max_body_size 12m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /admin/ {
        return 404;
    }

    location / {
        set $django_upstream http://api:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# --- LK: lk.mini-kbp.site → Next.js; /staff → panel; /api → api subdomain ---
server {
    listen 80;
    server_name lk.mini-kbp.site mini-kbp.site localhost.mini-kbp.site 26.85.162.251;

    client_max_body_size 12m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.mini-kbp.site https: wss:; frame-ancestors 'self';" always;

    location /admin/ {
        return 404;
    }

    location ^~ /staff {
        return 301 https://panel.mini-kbp.site$request_uri;
    }

    location /api/ {
        return 301 https://api.mini-kbp.site$request_uri;
    }

    location / {
        set $next_upstream http://web:3000;
        proxy_pass $next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

